packages:
  - apps/*
  - packages/*
  - fixtures/*/*

overrides:
  # Next 15 still pins an affected PostCSS version (GHSA-fxqj-rqcc-2cmp).
  next>postcss: 8.5.23
  # Refresh vulnerable transitive resolutions without updating unrelated tools.
  # GHSA-2v37-7h3g-55p8 and GHSA-68fv-2mgg-jv7q.
  nanoid@>=3 <3.3.18: 3.3.20
  source-map-js@<1.2.2: 1.2.2
  # Development tooling security patches, kept on each existing major version.
  # Preserve immutable fixture bytes while running their tests with the fix.
  vitest@4.1.10: 4.1.11
  brace-expansion@>=1 <1.1.21: 1.1.21
  brace-expansion@>=5 <5.0.12: 5.0.12
  js-yaml@>=4 <4.3.2: 4.3.2
  undici@>=8 <8.10.2: 8.10.2

allowBuilds:
  esbuild: true
  # Image optimisation is unused in this milestone. Supported platforms ship
  # prebuilt binaries, so no install script is required.
  sharp: false
